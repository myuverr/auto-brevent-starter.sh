name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package module
        working-directory: shevery
        run: |
          zip -r "../shevery-module-${GITHUB_REF_NAME}.zip" .
          zip -j "../shevery-module-${GITHUB_REF_NAME}.zip" ../README.md ../LICENSE*

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            auto-brevent-starter.sh
            shevery-module-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            auto-brevent-starter.sh \
            "shevery-module-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --generate-notes
